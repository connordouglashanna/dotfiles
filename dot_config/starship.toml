[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# Two-line layout
format = '$all'

[fill]
symbol = " "

[package]
disabled = true

[time]
disabled = false
format = "[$time]($style)"
time_format = "%R" 
style = "dimmed subtext0"

[gcloud]
format = "on [$symbol $account]($style) "
symbol = "☁️"
style = "bold blue"

[rlang]
symbol = "󰟔 "
style = "bold blue"
disabled = false
format = "[$symbol($version )]($style)"
detect_extensions = ["R", "r", "Rmd", "rmd", "qmd"]
detect_files = [".Rprofile", "Rproject", ".RData"]

[character]
success_symbol = " [󰄛](bold green) "
error_symbol = " [󰄛](bold red) "

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold mauve"

[git_state]
disabled = true

[git_status]
disabled = true

[git_metrics]
disabled = true

[nodejs]
symbol = " "
style = "bold green"

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold peach"
